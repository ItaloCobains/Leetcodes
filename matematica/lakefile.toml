name = "matematica"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Matematica", "Calculo"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "LeanPlot"
git = "https://github.com/alok/LeanPlot"
rev = "bdacc90fe0479ed75216d5b18cecdaa2c81d52d8"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Matematica"
globs = ["Matematica", "Matematica.Aula01"]

[[lean_lib]]
name = "Calculo"
srcDir = "../calculo_estudo/lean"
